name: lora-r16-lr5e4
mode: train

model:
  lora:
    enabled: true
    rank: 16
    alpha: 32

training:
  max_steps: 3072
  learning_rate: 0.0005
  warmup_ratio: 0.05
  batch_size: 2
  gradient_accumulation_steps: 8
  max_sequence_length: 256
  evaluate_every_steps: 100
  save_every_steps: 100

  early_stopping:
    enabled: true
    patience: 5
    min_delta: 0.001