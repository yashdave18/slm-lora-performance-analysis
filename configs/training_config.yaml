training:
  seed: 42

  # Initial budget; revisit after the smoke test.
  max_steps: 300
  max_sequence_length: 256

  batch_size: 2
  gradient_accumulation_steps: 8

  optimizer: adamw
  learning_rate: 0.0001
  weight_decay: 0.01
  scheduler: cosine
  warmup_ratio: 0.05
  max_grad_norm: 1.0

  precision: fp16
  gradient_checkpointing: true

  log_every_steps: 10
  evaluate_every_steps: 100
  save_every_steps: 100
  ema_decay: 0.9

  # Override with a Google Drive path in Colab.
  checkpoint_dir: checkpoints

  wandb:
    enabled: true
    project: slm-lora-performance-analysis
    entity: daveyash1218-dwarkadas-j-sanghvi-college-of-engineering
    mode: online
